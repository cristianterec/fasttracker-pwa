<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastTrackers - Gestion patients</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>FastTrackers</h1>
      <div class="topbar-actions">
        <span id="doctorLabel" class="user-label"></span>
        <button id="logoutButton" class="secondary hidden">Se déconnecter</button>
      </div>
    </header>

    <main class="main">
      <section id="authSection" class="card">
        <h2>Connexion</h2>
        <form id="loginForm" class="stack">
          <label>
            Adresse e-mail
            <input type="email" name="email" required autocomplete="username" />
          </label>
          <label>
            Code PIN (4 chiffres)
            <input type="password" name="pin" pattern="\d{4}" maxlength="4" required autocomplete="current-password" />
          </label>
          <button type="submit" class="primary">Se connecter</button>
          <p class="muted">Pas encore de compte ? <button type="button" id="toggleToRegister" class="link">Créer un compte</button></p>
        </form>

        <form id="registerForm" class="stack hidden">
          <label>
            Adresse e-mail
            <input type="email" name="email" required autocomplete="username" />
          </label>
          <label>
            Code PIN (4 chiffres)
            <input type="password" name="pin" pattern="\d{4}" maxlength="4" required autocomplete="new-password" />
          </label>
          <label>
            Confirmation du PIN
            <input type="password" name="confirm" pattern="\d{4}" maxlength="4" required autocomplete="new-password" />
          </label>
          <button type="submit" class="primary">Créer le compte</button>
          <p class="muted">Déjà inscrit ? <button type="button" id="toggleToLogin" class="link">Se connecter</button></p>
        </form>
      </section>

      <section id="appSection" class="hidden">
        <div class="banner">Les noms ne quittent jamais cet appareil. Le serveur ne stocke que les codes patients.</div>

        <section class="card stack">
          <h2>Ajouter un patient</h2>
          <form id="addPatientForm" class="form-grid">
            <label>
              Nom de famille (local uniquement)
              <input type="text" name="lastName" autocomplete="off" />
            </label>
            <label>
              Motif principal
              <input type="text" name="complaint" required autocomplete="off" />
            </label>
            <button type="submit" class="primary">Créer le patient</button>
          </form>
        </section>

        <section class="card stack">
          <div class="table-toolbar">
            <h2>Patients</h2>
            <input type="search" id="searchInput" placeholder="Rechercher (nom local ou motif)" />
          </div>
          <div class="table-wrapper">
            <table id="patientsTable">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Nom (local)</th>
                  <th>Motif</th>
                  <th>Créé</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="patientsTableBody"></tbody>
            </table>
            <div id="noPatientsRow" class="empty-state">Aucun patient pour le moment.</div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
